apiVersion: apps/v1
kind: Deployment
metadata:
  name: teerop-frontend
  namespace: teerop-pos
  labels:
    app: teerop-frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: teerop-frontend
  template:
    metadata:
      labels:
        app: teerop-frontend
    spec:
      containers:
        - name: frontend
          image: usman22siddiqui/teerop-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: teerop-pos
  labels:
    app: teerop-frontend
spec:
  selector:
    app: teerop-frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
  type: ClusterIP
