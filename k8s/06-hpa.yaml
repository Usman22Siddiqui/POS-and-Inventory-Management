apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teerop-backend-hpa
  namespace: teerop-pos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teerop-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: teerop-frontend-hpa
  namespace: teerop-pos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: teerop-frontend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
