apiVersion: apps/v1
kind: Deployment
metadata:
  name: teerop-backend
  namespace: teerop-pos
  labels:
    app: teerop-backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: teerop-backend
  template:
    metadata:
      labels:
        app: teerop-backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/api/metrics"
    spec:
      containers:
        - name: backend
          image: usman22siddiqui/teerop-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: teerop-config
            - secretRef:
                name: teerop-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: teerop-pos
  labels:
    app: teerop-backend
spec:
  selector:
    app: teerop-backend
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
