name: Teerop POS CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ── Code Quality & Security Audit ──
  quality-check:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit Backend Dependencies
        working-directory: ./backend
        run: npm audit --audit-level=critical || true

      - name: Audit Frontend Dependencies
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

  # ── Build & Verification Job ──
  build-and-test:
    name: Build & Code Verification
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Validate Backend
        working-directory: ./backend
        run: |
          npm install
          node -e "require('./models'); console.log('✓ Backend models and associations validated');"

      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm install
          npm run build

  # ── Containerization & Docker Compose Verification ──
  docker-validation:
    name: Docker & Microservices Build
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose Config
        run: docker compose config

      - name: Build Docker Service Containers
        run: docker compose build
